<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --primary:#2563eb;
  --secondary:#7c3aed;
  --bg:#f5f7fb;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --border:#e5e7eb;
  --success:#16a34a;
}

body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.3s;
}

body.dark{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#f8fafc;
  --muted:#cbd5e1;
  --border:#334155;
}

/* HEADER */

header{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  padding:18px 6%;
  position:sticky;
  top:0;
  z-index:1000;
}

.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:28px;
  font-weight:bold;
}

.logo span{
  color:#fde047;
}

.tagline{
  font-size:12px;
  opacity:.9;
}

.header-buttons{
  display:flex;
  gap:10px;
}

.icon-btn{
  border:0;
  background:rgba(255,255,255,.18);
  color:white;
  padding:10px 13px;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
}

/* HERO */

.hero{
  text-align:center;
  padding:55px 20px;
  background:linear-gradient(135deg,#eff6ff,#f5f3ff);
}

.dark .hero{
  background:linear-gradient(135deg,#111827,#1e1b4b);
}

.hero h1{
  font-size:42px;
  margin-bottom:12px;
}

.hero h1 span{
  color:var(--primary);
}

.hero p{
  color:var(--muted);
  margin-bottom:25px;
}

.search-box{
  max-width:700px;
  margin:auto;
  position:relative;
}

.search-box input{
  width:100%;
  padding:17px 20px;
  border:2px solid var(--border);
  border-radius:14px;
  font-size:16px;
  outline:none;
  background:var(--card);
  color:var(--text);
}

/* CATEGORIES */

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:20px 6%;
  background:var(--card);
}

.categories button{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:10px 17px;
  border-radius:30px;
  cursor:pointer;
  white-space:nowrap;
}

.categories button.active,
.categories button:hover{
  background:var(--primary);
  color:white;
  border-color:var(--primary);
}

/* FILTERS */

.filters{
  padding:20px 6%;
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:center;
}

.filters select,
.filters input{
  padding:11px 14px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--card);
  color:var(--text);
}

.reset{
  padding:11px 18px;
  border:0;
  border-radius:9px;
  background:#ef4444;
  color:white;
  cursor:pointer;
}

/* PRODUCTS */

.container{
  padding:10px 6% 100px;
}

.result-count{
  margin-bottom:18px;
  color:var(--muted);
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:20px;
}

.product-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  transition:.25s;
  position:relative;
}

.product-card:hover{
  transform:translateY(-5px);
  box-shadow:0 12px 30px rgba(0,0,0,.12);
}

.product-img{
  width:100%;
  height:200px;
  object-fit:cover;
  background:#f1f5f9;
}

.wishlist{
  position:absolute;
  top:10px;
  right:10px;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:white;
  cursor:pointer;
  font-size:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.wishlist.active{
  color:#ef4444;
}

.product-info{
  padding:15px;
}

.brand{
  color:var(--primary);
  font-size:12px;
  font-weight:bold;
  text-transform:uppercase;
}

.product-info h3{
  margin:6px 0;
  font-size:17px;
}

.rating{
  color:#f59e0b;
  font-size:14px;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin:8px 0;
}

.lowest{
  color:var(--success);
  font-size:12px;
  font-weight:bold;
}

.card-buttons{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.card-buttons button{
  flex:1;
  padding:10px 5px;
  border-radius:8px;
  cursor:pointer;
  border:1px solid var(--primary);
  background:var(--primary);
  color:white;
}

.card-buttons button.compare-btn{
  background:transparent;
  color:var(--primary);
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:2000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  background:var(--card);
  color:var(--text);
  width:min(850px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:18px;
  padding:25px;
  position:relative;
}

.close{
  position:absolute;
  right:18px;
  top:15px;
  border:0;
  background:none;
  color:var(--text);
  font-size:27px;
  cursor:pointer;
}

.modal-product{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:25px;
}

.modal-product img{
  width:100%;
  border-radius:12px;
}

.spec-table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

.spec-table td{
  border:1px solid var(--border);
  padding:10px;
}

.spec-table td:first-child{
  font-weight:bold;
}

.offers{
  margin-top:20px;
}

.offer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:13px;
  border:1px solid var(--border);
  border-radius:10px;
  margin-top:10px;
}

.buy{
  background:var(--success);
  color:white;
  padding:9px 15px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}

/* COMPARE BAR */

.compare-bar{
  display:none;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111827;
  color:white;
  padding:14px 6%;
  z-index:1500;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.compare-bar button{
  background:#2563eb;
  color:white;
  border:0;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
}

/* COMPARE */

.compare-table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

.compare-table th,
.compare-table td{
  border:1px solid var(--border);
  padding:12px;
  text-align:center;
}

.compare-table img{
  width:100px;
  height:80px;
  object-fit:cover;
  border-radius:8px;
}

/* FOOTER */

footer{
  background:#111827;
  color:white;
  padding:35px 6%;
  text-align:center;
}

footer p{
  color:#cbd5e1;
  margin-top:8px;
}

/* RESPONSIVE */

@media(max-width:650px){

  .nav{
    flex-wrap:wrap;
  }

  .hero h1{
    font-size:30px;
  }

  .modal-product{
    grid-template-columns:1fr;
  }

  .product-grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .product-img{
    height:150px;
  }

  .product-info{
    padding:10px;
  }

  .product-info h3{
    font-size:14px;
  }

  .card-buttons{
    flex-direction:column;
  }

  .compare-bar{
    flex-direction:column;
    text-align:center;
  }
}
</style>
</head>

<section class="hero">

</section>

  <button onclick="setCategory('Books',this)">📚 Books</button>

</div>

<!-- FILTERS -->

<div class="filters">

  <select id="sort" onchange="applyFilters()">
    <option value="default">Sort: Recommended</option>
    <option value="low">Price: Low → High</option>
    <option value="high">Price: High → Low</option>
    <option value="rating">Rating: High → Low</option>
  </select>

  <input
    type="number"
    id="minPrice"
    placeholder="Min ₹"
    oninput="applyFilters()">

  <input
    type="number"
    id="maxPrice"
    placeholder="Max ₹"
    oninput="applyFilters()">

  <button class="reset" onclick="resetFilters()">Reset</button>

</div>

<!-- PRODUCTS -->

<main class="container">

  <div class="result-count" id="resultCount"></div>

  <div class="product-grid" id="productGrid"></div>

</main>

<!-- PRODUCT MODAL -->

<div class="modal" id="productModal">

  <div class="modal-box">

    <button class="close" onclick="closeProduct()">×</button>

    <div id="productDetails"></div>

  </div>

</div>

<!-- COMPARE MODAL -->

<div class="modal" id="compareModal">

  <div class="modal-box">

    <button class="close" onclick="closeCompare()">×</button>

    <h2>⚖️ Compare Products</h2>

    <div id="compareContent"></div>

  </div>

</div>

<!-- COMPARE BAR -->

<div class="compare-bar" id="compareBar">

  <span id="compareText">0 products selected</span>

  <button onclick="openCompare()">Compare Now</button>

</div>

<footer>

  <h2>CompareX</h2>
  <p>Compare. Choose. Save.</p>
  <p>Find products. Compare prices. Make smarter choices.</p>

</footer>

/* =====================================================
   VARIABLES
===================================================== */

let currentCategory="All";
let compareList=[];
let wishlist=JSON.parse(localStorage.getItem("comparexWishlist") || "[]");

/* =====================================================
   LOWEST PRICE
===================================================== */

function getLowestPrice(product){
  return Math.min(...product.offers.map(o=>o[1]));
}

/* =====================================================
   DISPLAY PRODUCTS
===================================================== */

function displayProducts(list){

  const grid=document.getElementById("productGrid");

  document.getElementById("resultCount").innerText=
    `${list.length} products found`;

  if(list.length===0){

    grid.innerHTML=`
      <div style="grid-column:1/-1;text-align:center;padding:50px">
        <h2>😕 No products found</h2>
        <p style="margin-top:10px;color:var(--muted)">
          Try another search or category.
        </p>
      </div>
    `;

    return;
  }

  grid.innerHTML=list.map(p=>{

    const isWish=wishlist.includes(p.id);

    return `

      <div class="product-card">

        <button
          class="wishlist ${isWish?'active':''}"
          onclick="toggleWishlist(${p.id})">
          ${isWish?'♥':'♡'}
        </button>

        <img
          class="product-img"
          src="${p.image}"
          alt="${p.name}"
          loading="lazy">

        <div class="product-info">

          <div class="brand">${p.brand}</div>

          <h3>${p.name}</h3>

          <div class="rating">
            ⭐ ${p.rating}
          </div>

          <div class="price">
            ₹${p.price.toLocaleString("en-IN")}
          </div>

          <div class="lowest">
            ✓ Lowest price ₹${getLowestPrice(p).toLocaleString("en-IN")}
          </div>

          <div class="card-buttons">

            <button onclick="openProduct(${p.id})">
              View Details
            </button>

            <button
              class="compare-btn"
              onclick="toggleCompare(${p.id})">
              ${compareList.includes(p.id) ? "✓ Added" : "⚖️ Compare"}
            </button>

          </div>

        </div>

      </div>

    `;

  }).join("");
}

/* =====================================================
   SEARCH + FILTER + SORT
===================================================== */

function applyFilters(){

  const search=document.getElementById("search").value.toLowerCase();

  const min=
    Number(document.getElementById("minPrice").value) || 0;

  const maxInput=document.getElementById("maxPrice").value;

  const max=maxInput ? Number(maxInput) : Infinity;

  const sort=document.getElementById("sort").value;

  let result=products.filter(p=>{

    const matchesCategory=
      currentCategory==="All" ||
      p.category===currentCategory;

    const matchesSearch=
      p.name.toLowerCase().includes(search) ||
      p.brand.toLowerCase().includes(search) ||
      p.category.toLowerCase().includes(search);

    const price=getLowestPrice(p);

    return matchesCategory &&
           matchesSearch &&
           price>=min &&
           price<=max;

  });

  if(sort==="low"){
    result.sort((a,b)=>getLowestPrice(a)-getLowestPrice(b));
  }

  if(sort==="high"){
    result.sort((a,b)=>getLowestPrice(b)-getLowestPrice(a));
  }

  if(sort==="rating"){
    result.sort((a,b)=>b.rating-a.rating);
  }

  displayProducts(result);
}

/* =====================================================
   CATEGORY
===================================================== */

function setCategory(category,button){

  currentCategory=category;

  document.querySelectorAll(".categories button")
    .forEach(b=>b.classList.remove("active"));

  button.classList.add("active");

  applyFilters();
}

/* =====================================================
   RESET
===================================================== */

function resetFilters(){

  document.getElementById("search").value="";
  document.getElementById("minPrice").value="";
  document.getElementById("maxPrice").value="";
  document.getElementById("sort").value="default";

  currentCategory="All";

  document.querySelectorAll(".categories button")
    .forEach(b=>b.classList.remove("active"));

  document.querySelector(".categories button")
    .classList.add("active");

  displayProducts(products);
}

/* =====================================================
   PRODUCT DETAILS
===================================================== */

function openProduct(id){

  const p=products.find(x=>x.id===id);

  if(!p)return;

  const lowest=getLowestPrice(p);

  let specs="";

  Object.entries(p.specs).forEach(([key,value])=>{

    specs+=`
      <tr>
        <td>${key}</td>
        <td>${value}</td>
      </tr>
    `;

  });

  let offers="";

  p.offers.forEach(o=>{

    offers+=`

      <div class="offer">

        <div>
          <strong>${o[0]}</strong>
          <br>
          ₹${o[1].toLocaleString("en-IN")}
        </div>

        <a
          class="buy"
          href="${o[2]}"
          target="_blank"
          rel="noopener noreferrer">
          Buy Now
        </a>

      </div>

    `;

  });

  document.getElementById("productDetails").innerHTML=`

    <div class="modal-product">

      <img src="${p.image}" alt="${p.name}">

      <div>

        <div class="brand">${p.brand}</div>

        <h2>${p.name}</h2>

        <p style="margin:10px 0">
          ⭐ ${p.rating}
        </p>

        <h2 style="color:var(--success)">
          ₹${lowest.toLocaleString("en-IN")}
        </h2>

        <p style="color:var(--muted)">
          Lowest available demo price
        </p>

      </div>

    </div>

    <h3 style="margin-top:25px">
      Specifications
    </h3>

    <table class="spec-table">
      ${specs}
    </table>

    <div class="offers">

      <h3>🛍️ Store Offers</h3>

      ${offers}

    </div>

  `;

  document.getElementById("productModal").style.display="flex";
}

function closeProduct(){
  document.getElementById("productModal").style.display="none";
}

/* =====================================================
   COMPARE
===================================================== */

function toggleCompare(id){

  if(compareList.includes(id)){

    compareList=
      compareList.filter(x=>x!==id);

  }else{

    if(compareList.length>=3){

      alert("You can compare maximum 3 products.");

      return;
    }

    compareList.push(id);
  }

  updateCompareBar();
  applyFilters();
}

function updateCompareBar(){

  const bar=document.getElementById("compareBar");

  if(compareList.length===0){

    bar.style.display="none";

  }else{

    bar.style.display="flex";

    document.getElementById("compareText").innerText=
      `${compareList.length} product${compareList.length>1?"s":""} selected`;

  }
}

function openCompare(){

  if(compareList.length<2){

    alert("Please select at least 2 products to compare.");

    return;
  }

  const selected=
    compareList.map(id=>products.find(p=>p.id===id));

  const allSpecs=[
    ...new Set(
      selected.flatMap(p=>Object.keys(p.specs))
    )
  ];

  let html=`

    <table class="compare-table">

      <tr>
        <th>Feature</th>

        ${selected.map(p=>`
          <th>
            <img src="${p.image}">
            <br>
            ${p.name}
          </th>
        `).join("")}

      </tr>

      <tr>
        <td>Rating</td>

        ${selected.map(p=>`
          <td>⭐ ${p.rating}</td>
        `).join("")}

      </tr>

      <tr>
        <td>Lowest Price</td>

        ${selected.map(p=>`
          <td>
            <strong>
              ₹${getLowestPrice(p).toLocaleString("en-IN")}
            </strong>
          </td>
        `).join("")}

      </tr>

  `;

  allSpecs.forEach(spec=>{

    html+=`

      <tr>

        <td>${spec}</td>

        ${selected.map(p=>`
          <td>${p.specs[spec] || "-"}</td>
        `).join("")}

      </tr>

    `;

  });

  html+=`

      <tr>

        <td>Stores</td>

        ${selected.map(p=>`
          <td>
            ${p.offers.map(o=>o[0]).join(" / ")}
          </td>
        `).join("")}

      </tr>

    </table>

  `;

  document.getElementById("compareContent").innerHTML=html;

  document.getElementById("compareModal").style.display="flex";
}

function closeCompare(){

  document.getElementById("compareModal").style.display="none";
}

/* =====================================================
   WISHLIST
===================================================== */

function toggleWishlist(id){

  if(wishlist.includes(id)){

    wishlist=
      wishlist.filter(x=>x!==id);

  }else{

    wishlist.push(id);

  }

  localStorage.setItem(
    "comparexWishlist",
    JSON.stringify(wishlist)
  );

  applyFilters();
}

function showWishlist(){

  if(wishlist.length===0){

    alert("❤️ Your wishlist is empty.");

    return;
  }

  const list=
    products.filter(p=>wishlist.includes(p.id));

  displayProducts(list);

  window.scrollTo({
    top:document.querySelector(".container").offsetTop-80,
    behavior:"smooth"
  });
}

/* =====================================================
   DARK MODE
===================================================== */

function toggleDark(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "comparexDark",
    document.body.classList.contains("dark")
  );
}

if(localStorage.getItem("comparexDark")==="true"){
  document.body.classList.add("dark");
}

/* =====================================================
   MODAL CLICK OUTSIDE
===================================================== */

window.onclick=function(e){

  if(e.target===document.getElementById("productModal")){
    closeProduct();
  }

  if(e.target===document.getElementById("compareModal")){
    closeCompare();
  }

};

/* =====================================================
   START
===================================================== */

displayProducts(products);
updateCompareBar();

</script>
