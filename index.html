<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CompareX - Compare. Choose. Save.</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}


/* HEADER */

header{
  background:#101b3d;
  color:white;
  padding:16px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:26px;
  font-weight:800;
}

.logo span{
  color:#39d98a;
}

.tag{
  font-size:13px;
  color:#cbd3e8;
}


/* HERO */

.hero{
  text-align:center;
  padding:55px 20px;
  background:linear-gradient(135deg,#101b3d,#243b80);
  color:white;
}

.hero h1{
  font-size:42px;
  margin-bottom:12px;
}

.hero p{
  font-size:16px;
  margin-bottom:25px;
}


/* SEARCH */

.search{
  max-width:650px;
  width:100%;
  margin:auto;
  display:flex;
  background:white;
  border-radius:12px;
  overflow:hidden;
}

.search input{
  flex:1;
  min-width:0;
  border:0;
  outline:none;
  padding:16px;
  font-size:16px;
}

.search button{
  border:0;
  background:#39d98a;
  color:#101b3d;
  padding:0 22px;
  font-weight:bold;
  cursor:pointer;
}


/* MAIN */

main{
  max-width:1100px;
  margin:35px auto;
  padding:0 15px;
}


/* CATEGORIES */

.categories{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:15px 0 30px;
}

.cat{
  border:0;
  background:white;
  padding:10px 16px;
  border-radius:20px;
  cursor:pointer;
  box-shadow:0 2px 8px #00000012;
  font-size:14px;
}

.cat:hover,
.cat.active{
  background:#39d98a;
  color:#101b3d;
}


/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:20px;
}


/* CARD */

.card{
  background:white;
  border-radius:16px;
  padding:18px;
  box-shadow:0 5px 18px #00000012;
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
}


/* IMAGE */

.product-img{
  height:160px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:75px;
  background:#f1f4fa;
  border-radius:12px;
  margin-bottom:15px;
  cursor:pointer;
}

.card h3{
  margin-bottom:8px;
  font-size:18px;
  cursor:pointer;
}

.rating{
  color:#f5a623;
  margin-bottom:12px;
  font-size:14px;
}


/* VIEW PRODUCT */

.view-btn{
  width:100%;
  border:0;
  background:#eef2f8;
  color:#101b3d;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  margin-bottom:8px;
}

.view-btn:hover{
  background:#39d98a;
}


/* OFFERS */

.offer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-top:1px solid #eee;
  padding:12px 0;
}

.store{
  font-weight:bold;
  font-size:14px;
}

.price{
  font-weight:bold;
  font-size:16px;
  margin-bottom:5px;
}

.lowest{
  color:#15945d;
  font-size:11px;
  font-weight:bold;
  margin-top:3px;
}


/* BUY */

.buy{
  background:#101b3d;
  color:white;
  border:0;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
  font-size:12px;
}

.buy:hover{
  background:#39d98a;
  color:#101b3d;
}


/* NO RESULT */

.noresult{
  text-align:center;
  padding:40px;
  color:#777;
  grid-column:1/-1;
}


/* MODAL */

.modal{
  display:none;
  position:fixed;
  z-index:1000;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:#00000099;
  padding:20px;
  overflow:auto;
}

.modal-box{
  background:white;
  max-width:600px;
  margin:50px auto;
  border-radius:18px;
  padding:25px;
  position:relative;
}

.close{
  position:absolute;
  right:18px;
  top:12px;
  font-size:28px;
  cursor:pointer;
  color:#777;
}

.modal-icon{
  height:180px;
  background:#f1f4fa;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:85px;
  margin-bottom:20px;
}

.modal-box h2{
  margin-bottom:8px;
}

.modal-rating{
  color:#f5a623;
  margin-bottom:20px;
}

.modal-offer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-top:1px solid #eee;
  padding:15px 0;
}

.modal-store{
  font-weight:bold;
}

.modal-price{
  font-weight:bold;
  margin-bottom:6px;
}


/* FOOTER */

footer{
  text-align:center;
  padding:30px;
  color:#777;
  font-size:13px;
}


/* MOBILE */

@media(max-width:600px){

  header{
    padding:15px;
  }

  .logo{
    font-size:23px;
  }

  .tag{
    display:none;
  }

  .hero{
    padding:45px 15px;
  }

  .hero h1{
    font-size:32px;
  }

  .hero p{
    font-size:14px;
  }

  .search{
    width:100%;
  }

  .search input{
    padding:14px;
    font-size:14px;
  }

  .search button{
    padding:0 12px;
    font-size:14px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .modal{
    padding:10px;
  }

  .modal-box{
    margin:25px auto;
    padding:18px;
  }

}


/* SMALL PHONES */

@media(max-width:380px){

  .search button{
    padding:0 9px;
    font-size:12px;
  }

  .search input{
    font-size:13px;
  }

}

</style>

</head>

/* =====================================================
   CATEGORY
===================================================== */

let selected="All";


function filterCat(cat,button){

  selected=cat;

  document
    .querySelectorAll(".cat")
    .forEach(btn=>{
      btn.classList.remove("active");
    });

  button.classList.add("active");

  render();

}



/* =====================================================
   OPEN PRODUCT
===================================================== */

function openProduct(id){

  const product=
    products.find(p=>p.id===id);

  if(!product) return;

  const sorted=
    [...product.offers]
    .sort((a,b)=>a.price-b.price);

  const min=
    sorted[0].price;


  document.getElementById("modalContent").innerHTML=`

    <div class="modal-icon">
      ${product.icon}
    </div>

    <h2>
      ${product.name}
    </h2>

    <div class="modal-rating">
      ⭐ ${product.rating} / 5
    </div>

    <p style="margin-bottom:18px;color:#666">
      Compare prices for this product across stores.
    </p>

    ${
      sorted.map(offer=>`

        <div class="modal-offer">

          <div>

            <div class="modal-store">
              ${offer.store}
            </div>

            ${
              offer.price===min
              ?
              '<div class="lowest">🟢 LOWEST PRICE</div>'
              :
              ''
            }

          </div>

          <div>

            <div class="modal-price">
              ₹${offer.price.toLocaleString('en-IN')}
            </div>

            <button
              class="buy"
              onclick="goToProduct('${offer.url}')">

              Buy Now

            </button>

          </div>

        </div>

      `).join("")
    }

  `;


  document.getElementById("productModal").style.display="block";

}



/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal(){

  document.getElementById("productModal").style.display="none";

}


window.onclick=function(event){

  const modal=
    document.getElementById("productModal");

  if(event.target===modal){

    closeModal();

  }

};



/* =====================================================
   GO TO PRODUCT
===================================================== */

function goToProduct(url){

  window.open(url,"_blank");

}



/* =====================================================
   RENDER
===================================================== */

function render(){

  const q=
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const box=
    document.getElementById("products");


  const list=
    products.filter(product=>

      (
        selected==="All" ||
        product.cat===selected
      )

      &&

      (
        product.name.toLowerCase().includes(q) ||
        product.brand.toLowerCase().includes(q) ||
        product.cat.toLowerCase().includes(q)
      )

    );


  if(list.length===0){

    box.innerHTML=`

      <div class="noresult">

        <h3>No products found 😕</h3>

        <p style="margin-top:8px">
          Try searching another product or category.
        </p>

      </div>

    `;

    return;

  }



  box.innerHTML=

    list.map(product=>{

      const sorted=
        [...product.offers]
        .sort((a,b)=>a.price-b.price);

      const min=
        sorted[0].price;


      return `

        <article class="card">


          <div
            class="product-img"
            onclick="openProduct('${product.id}')">

            ${product.icon}

          </div>


          <h3
            onclick="openProduct('${product.id}')">

            ${product.name}

          </h3>


          <div class="rating">

            ⭐ ${product.rating}

          </div>


          <button
            class="view-btn"
            onclick="openProduct('${product.id}')">

            View Product & Compare Prices

          </button>


          <div class="offer">

            <div>

              <div class="store">
                Best Price
              </div>

              <div class="lowest">
                🟢 FROM
              </div>

            </div>


            <div>

              <div class="price">
                ₹${min.toLocaleString('en-IN')}
              </div>

            </div>

          </div>


        </article>

      `;

    }).join("");

}

===================================================== */
