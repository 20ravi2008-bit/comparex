<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CompareX - Compare. Choose. Save.</title>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

:root{
 --bg:#f4f7fb;
 --card:#fff;
 --text:#172033;
 --muted:#64748b;
 --primary:#2563eb;
 --accent:#7c3aed;
 --border:#e2e8f0;
 --success:#16a34a;
}

body.dark{
 --bg:#0f172a;
 --card:#1e293b;
 --text:#f1f5f9;
 --muted:#94a3b8;
 --border:#334155;
}

body{
 font-family:Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
 transition:.2s;
}

/* HEADER */

header{
 background:linear-gradient(120deg,#101b3d,#2563eb);
 color:white;
 padding:22px 5%;
}

.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
 flex-wrap:wrap;
}

.logo{
 font-size:28px;
 font-weight:800;
}

.logo span{
 color:#39d98a;
}

.tagline{
 font-size:12px;
 margin-top:5px;
 color:#dbeafe;
}

.controls{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
}

button,select,input{
 font:inherit;
}

.btn{
 border:0;
 border-radius:9px;
 padding:10px 14px;
 cursor:pointer;
 font-weight:600;
}

.light-btn{
 background:white;
 color:#172033;
}

.search-area{
 display:flex;
 gap:8px;
 margin-top:22px;
}

.search-area input{
 flex:1;
 min-width:0;
 padding:14px;
 border:0;
 border-radius:10px;
 outline:none;
}

/* HERO */

.hero{
 padding:28px 5% 12px;
}

.hero h1{
 font-size:30px;
 margin-bottom:9px;
}

.hero p{
 color:var(--muted);
 line-height:1.6;
}

/* CATEGORIES */

.categories{
 display:flex;
 gap:9px;
 overflow-x:auto;
 padding:16px 5%;
}

.cat{
 white-space:nowrap;
 border:1px solid var(--border);
 background:var(--card);
 color:var(--text);
 padding:10px 15px;
 border-radius:22px;
 cursor:pointer;
}

.cat.active{
 background:var(--primary);
 color:white;
}

/* FILTERS */

.filters{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 padding:0 5% 20px;
}

.filters input,
.filters select{
 padding:10px;
 border:1px solid var(--border);
 border-radius:8px;
 background:var(--card);
 color:var(--text);
 max-width:100%;
}

main{
 padding:0 5% 35px;
}

.section-title{
 margin:10px 0 18px;
}

/* PRODUCTS */

.products{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:18px;
}

.product{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:14px;
 overflow:hidden;
 position:relative;
 transition:.2s;
}

.product:hover{
 transform:translateY(-3px);
 box-shadow:0 8px 25px #0001;
}

.product-img{
 height:190px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#fff;
 padding:12px;
}

.product-img img{
 max-width:100%;
 max-height:165px;
 object-fit:contain;
}

.placeholder{
 color:#64748b;
 text-align:center;
 padding:20px;
 font-size:14px;
 line-height:1.6;
}

.product-info{
 padding:15px;
}

.product-info h3{
 font-size:16px;
 line-height:1.45;
 margin-bottom:9px;
}

.price{
 font-size:21px;
 font-weight:800;
 margin:10px 0;
}

.price.loading{
 font-size:14px;
 font-weight:600;
 color:var(--muted);
}

.muted{
 font-size:12px;
 color:var(--muted);
 line-height:1.6;
}

.actions{
 display:flex;
 gap:8px;
 margin-top:13px;
}

.actions button{
 flex:1;
}

.primary{
 background:var(--primary);
 color:white;
}

.primary:hover{
 opacity:.9;
}

.secondary{
 background:transparent;
 color:var(--text);
 border:1px solid var(--border);
}

.heart{
 position:absolute;
 right:10px;
 top:10px;
 border:0;
 border-radius:50%;
 padding:9px;
 background:white;
 cursor:pointer;
 font-size:17px;
 z-index:2;
}

/* BADGE */

.amazon-badge{
 display:inline-block;
 font-size:10px;
 font-weight:bold;
 background:#fff7ed;
 color:#c2410c;
 padding:5px 8px;
 border-radius:6px;
 margin-top:5px;
}

/* FOOTER */

footer{
 padding:25px 5%;
 background:var(--card);
 border-top:1px solid var(--border);
 color:var(--muted);
 font-size:13px;
 line-height:1.8;
}

/* MODAL */

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0009;
 z-index:10;
 align-items:center;
 justify-content:center;
 padding:18px;
}

.modal-box{
 width:100%;
 max-width:480px;
 max-height:90vh;
 overflow:auto;
 background:var(--card);
 color:var(--text);
 padding:22px;
 border-radius:16px;
}

.modal-box h2{
 margin-bottom:15px;
}

.modal-box p{
 margin:10px 0;
 line-height:1.6;
}

.close{
 float:right;
 cursor:pointer;
 border:0;
 background:none;
 color:var(--text);
 font-size:25px;
}

.empty{
 padding:25px;
 color:var(--muted);
}

/* LOADING */

.loading-box{
 text-align:center;
 padding:35px;
 color:var(--muted);
}

/* MOBILE */

@media(max-width:950px){
 .products{
  grid-template-columns:repeat(3,minmax(0,1fr));
 }
}

@media(max-width:650px){

 .products{
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
 }

 .product-img{
  height:145px;
 }

 .product-img img{
  max-height:125px;
 }

 .product-info{
  padding:10px;
 }

 .product-info h3{
  font-size:14px;
 }

 .price{
  font-size:18px;
 }

 .actions{
  flex-direction:column;
 }

 .actions button{
  padding:10px 6px;
  font-size:12px;
 }

 .hero h1{
  font-size:25px;
 }

 .logo{
  font-size:24px;
 }
}
</style>
</head>

<body>

<!-- HEADER -->

<header>

 <div class="top">

  <div>
   <div class="logo">
    Compare<span>X</span>
   </div>

   <div class="tagline">
    Compare. Choose. Save.
   </div>
  </div>

  <div class="controls">
