<style>

/* =========================
   BASIC
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f7fb;
    color:#172033;
}

/* =========================
   HEADER
========================= */

header{
    background:linear-gradient(135deg,#111827,#2563eb);
    color:white;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:26px;
    font-weight:bold;
}

.logo span{
    color:#60a5fa;
}

.tagline{
    font-size:13px;
    opacity:.85;
}

/* =========================
   HERO
========================= */

.hero{
    background:linear-gradient(135deg,#1d4ed8,#7c3aed);
    color:white;
    text-align:center;
    padding:65px 20px;
}

.hero h1{
    font-size:42px;
    margin-bottom:12px;
}

.hero p{
    font-size:17px;
    margin-bottom:28px;
    opacity:.9;
}

.search-box{
    max-width:650px;
    margin:auto;
    display:flex;
    background:white;
    border-radius:50px;
    padding:6px;
}

.search-box input{
    flex:1;
    border:none;
    outline:none;
    padding:15px 20px;
    font-size:16px;
    border-radius:50px;
}

.search-box button{
    border:none;
    background:#2563eb;
    color:white;
    padding:0 25px;
    border-radius:50px;
    cursor:pointer;
    font-weight:bold;
}

/* =========================
   CATEGORY
========================= */

.categories{
    padding:25px 7%;
    display:flex;
    gap:10px;
    overflow-x:auto;
}

.category-btn{
    border:none;
    background:white;
    padding:11px 18px;
    border-radius:25px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.category-btn.active{
    background:#2563eb;
    color:white;
}

/* =========================
   PRODUCTS
========================= */

.products-section{
    padding:15px 7% 100px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.section-title h2{
    font-size:26px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:22px;
}

.product-card{
    background:white;
    border-radius:18px;
    padding:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    transition:.3s;
    position:relative;
}

.product-card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.product-img{
    width:100%;
    height:210px;
    background:#f5f7fb;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.product-img img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:15px;
    transition:.3s;
}

.product-card:hover .product-img img{
    transform:scale(1.06);
}

.product-category{
    color:#2563eb;
    font-size:12px;
    font-weight:bold;
    margin-top:15px;
}

.product-name{
    font-size:18px;
    font-weight:bold;
    margin:7px 0;
}

.rating{
    color:#f59e0b;
    font-size:14px;
}

.price-box{
    margin:12px 0;
}

.lowest-label{
    font-size:12px;
    color:#16a34a;
    font-weight:bold;
}

.lowest-price{
    font-size:24px;
    font-weight:bold;
    color:#111827;
}

.store-count{
    color:#6b7280;
    font-size:13px;
}

/* =========================
   BUTTONS
========================= */

.button-row{
    display:flex;
    gap:8px;
    margin-top:14px;
}

.view-btn,
.compare-btn{
    flex:1;
    padding:11px 8px;
    border-radius:9px;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

.view-btn{
    background:#2563eb;
    color:white;
}

.compare-btn{
    background:#eef2ff;
    color:#2563eb;
}

.compare-btn.added{
    background:#16a34a;
    color:white;
}

/* =========================
   MODAL
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:3000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-content{
    background:white;
    width:100%;
    max-width:650px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:20px;
    padding:25px;
    position:relative;
}

.close{
    position:absolute;
    right:20px;
    top:15px;
    font-size:28px;
    cursor:pointer;
}

.modal-image{
    width:100%;
    height:250px;
    background:#f5f7fb;
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    margin-bottom:20px;
}

.modal-image img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:20px;
}

.modal-content h2{
    margin-bottom:8px;
}

.offer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    border:1px solid #e5e7eb;
    border-radius:12px;
    margin-top:10px;
}

.offer-price{
    font-size:19px;
    font-weight:bold;
}

.buy-btn{
    background:#16a34a;
    color:white;
    text-decoration:none;
    padding:9px 15px;
    border-radius:8px;
    font-weight:bold;
}

/* =========================
   COMPARE BAR
========================= */

.compare-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#111827;
    color:white;
    padding:14px 7%;
    display:none;
    justify-content:space-between;
    align-items:center;
    z-index:2000;
    box-shadow:0 -5px 20px rgba(0,0,0,.2);
}

.compare-bar.show{
    display:flex;
}

.compare-info{
    font-weight:bold;
}

.compare-now{
    background:#2563eb;
    border:none;
    color:white;
    padding:12px 22px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

/* =========================
   COMPARE MODAL
========================= */

.compare-modal-content{
    max-width:1000px;
}

.compare-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:20px;
}

.compare-product{
    border:1px solid #e5e7eb;
    border-radius:15px;
    padding:15px;
    background:#fafafa;
}

.compare-product img{
    width:100%;
    height:150px;
    object-fit:contain;
    background:white;
    border-radius:10px;
}

.compare-product h3{
    font-size:16px;
    margin:12px 0 5px;
}

.compare-price{
    color:#16a34a;
    font-size:20px;
    font-weight:bold;
    margin:8px 0;

.compare-store{
    display:flex;

    padding:8px 0;

/* =========================
   FOOTER
========================= */

footer{

    text-align:center;
    padding:30px 20px;

footer p{

========================= */

========================= */

        padding:0 18px;
    }

/* =========================
   VARIABLES
========================= */

let currentCategory = "All";

let compareList = [];


/* =========================
   GET LOWEST PRICE
========================= */

function getLowestPrice(product){

    return Math.min(
        ...product.stores.map(store => store.price)
    );

}


/* =========================
   DISPLAY PRODUCTS
========================= */

function displayProducts(list){

    const grid =
        document.getElementById("productGrid");

    grid.innerHTML = "";

    document.getElementById("productCount").textContent =
        `${list.length} products`;


    if(list.length === 0){

        grid.innerHTML = `
            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:50px;
                background:white;
                border-radius:15px;
            ">
                <h2>No products found 😕</h2>
                <p style="margin-top:8px;color:#6b7280;">
                    Try another search.
                </p>
            </div>
        `;

        return;
    }


    list.forEach(product => {

        const lowest =
            getLowestPrice(product);

        const isCompared =
            compareList.includes(product.id);


        grid.innerHTML += `

        <div class="product-card">

            <div class="product-img">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                    loading="lazy"
                >

            </div>


            <div class="product-category">
                ${product.category}
            </div>


            <div class="product-name">
                ${product.name}
            </div>


            <div class="rating">
                ⭐ ${product.rating}
            </div>


            <div class="price-box">

                <div class="lowest-label">
                    LOWEST PRICE
                </div>

                <div class="lowest-price">
                    ₹${lowest.toLocaleString("en-IN")}
                </div>

                <div class="store-count">
                    ${product.stores.length} stores
                </div>

            </div>


            <div class="button-row">

                <button
                    class="view-btn"
                    onclick="openProduct(${product.id})">

                    View Offers

                </button>


                <button
                    class="compare-btn ${isCompared ? "added" : ""}"
                    onclick="toggleCompare(${product.id})">

                    ${isCompared ? "✓ Added" : "⚖️ Compare"}

                </button>

            </div>

        </div>

        `;

    });

}


/* =========================
   SEARCH
========================= */

function searchProducts(){

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    let result = products;


    if(currentCategory !== "All"){

        result =
            result.filter(
                product =>
                product.category === currentCategory
            );

    }


    if(search){

        result =
            result.filter(product =>
                product.name
                .toLowerCase()
                .includes(search)
            );

    }


    displayProducts(result);

}


/* =========================
   CATEGORY FILTER
========================= */

function filterCategory(category,button){

    currentCategory = category;


    document
        .querySelectorAll(".category-btn")
        .forEach(btn =>
            btn.classList.remove("active")
        );


    button.classList.add("active");


    searchProducts();

}


/* =========================
   PRODUCT MODAL
========================= */

function openProduct(id){

    const product =
        products.find(p => p.id === id);


    if(!product) return;


    const lowest =
        getLowestPrice(product);


    const modalBody =
        document.getElementById("modalBody");


    modalBody.innerHTML = `

        <div class="modal-image">

            <img
                src="${product.image}"
                alt="${product.name}"
            >

        </div>


        <div class="product-category">
            ${product.category}
        </div>


        <h2>${product.name}</h2>


        <div class="rating">
            ⭐ ${product.rating}
        </div>


        <p style="
            margin-top:10px;
            color:#16a34a;
            font-weight:bold;
        ">
            Lowest price: ₹${lowest.toLocaleString("en-IN")}
        </p>


        <h3 style="margin-top:20px;">
            Compare Store Prices
        </h3>


        ${product.stores.map(store => `

            <div class="offer">

                <div>

                    <strong>
                        ${store.name}
                    </strong>

                    <div class="offer-price">
                        ₹${store.price.toLocaleString("en-IN")}
                    </div>

                </div>


                <a
                    class="buy-btn"
                    href="${store.url}"
                    target="_blank"
                    rel="noopener">

                    Buy Now

                </a>

            </div>

        `).join("")}

    `;


    document
        .getElementById("productModal")
        .classList.add("show");

}


/* =========================
   CLOSE PRODUCT MODAL
========================= */

function closeProductModal(){

    document
        .getElementById("productModal")
        .classList.remove("show");

}


/* =========================
   COMPARE
========================= */

function toggleCompare(id){

    if(compareList.includes(id)){

        compareList =
            compareList.filter(
                item => item !== id
            );

    }

    else{

        if(compareList.length >= 3){

            alert(
                "You can compare maximum 3 products."
            );

            return;
        }

        compareList.push(id);

    }


    updateCompareBar();

    searchProducts();

}


/* =========================
   UPDATE COMPARE BAR
========================= */

function updateCompareBar(){

    const bar =
        document.getElementById("compareBar");


    document.getElementById("compareCount")
        .textContent =
        compareList.length;


    if(compareList.length > 0){

        bar.classList.add("show");

    }

    else{

        bar.classList.remove("show");

    }

}


/* =========================
   OPEN COMPARE
========================= */

function openCompare(){

    if(compareList.length < 2){

        alert(
            "Select at least 2 products to compare."
        );

        return;

    }


    const selected =
        compareList.map(
            id =>
            products.find(
                product =>
                product.id === id
            )
        );


    const grid =
        document.getElementById("compareGrid");


    grid.innerHTML = selected.map(product => {

        const lowest =
            getLowestPrice(product);


        return `

        <div class="compare-product">

            <img
                src="${product.image}"
                alt="${product.name}"
            >


            <h3>
                ${product.name}
            </h3>


            <div>
                ⭐ ${product.rating}
            </div>


            <div class="compare-price">
                ₹${lowest.toLocaleString("en-IN")}
            </div>


            <div style="
                color:#6b7280;
                font-size:13px;
                margin-bottom:8px;
            ">
                Lowest available price
            </div>


            ${product.stores.map(store => `

                <div class="compare-store">

                    <span>
                        ${store.name}
                    </span>

                    <strong>
                        ₹${store.price.toLocaleString("en-IN")}
                    </strong>

                </div>

            `).join("")}

        </div>

        `;

    }).join("");


    document
        .getElementById("compareModal")
        .classList.add("show");

}


/* =========================
   CLOSE COMPARE
========================= */

function closeCompare(){

    document
        .getElementById("compareModal")
        .classList.remove("show");

}


/* =========================
   CLOSE MODALS ON BACKGROUND
========================= */

window.onclick = function(event){

    const productModal =
        document.getElementById("productModal");

    const compareModal =
        document.getElementById("compareModal");


    if(event.target === productModal){

        closeProductModal();

    }


    if(event.target === compareModal){

        closeCompare();

    }

};


/* =========================
   INITIAL LOAD
========================= */

displayProducts(products);

</script>

</body>
</html>
